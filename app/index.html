<!doctype html><html><head><meta charset="utf-8"><title>Volume Bar Theme</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff;background:transparent}
#setup{display:none;position:absolute;top:0;right:0;bottom:0;left:0;padding:120px;background:radial-gradient(ellipse at 50% 35%,#25252a,#111114 60%,#050506)}body.setup #setup{display:block}.panel{width:900px;margin:auto;text-align:center}h1{font-size:58px;font-weight:400}p{color:#bbb;font-size:26px;line-height:1.4}select,button{font-size:26px;color:white;background:#24242b;border:2px solid #666;border-radius:14px;padding:18px 28px;margin:10px}button:focus,select:focus{border-color:white;outline:none}.buttons{margin-top:30px}
#vol-card{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0;transition:opacity .18s ease-out}#vol-card.on{opacity:1}
.arch-pill{position:absolute;right:56px;top:50%;transform:translateY(-50%) translateX(100px);display:flex;flex-direction:column;align-items:center;transition:transform .22s cubic-bezier(.16,1,.3,1)}#vol-card.on .arch-pill{transform:translateY(-50%)}.dev-label{font-size:13px;margin-bottom:14px}.pill-wide{position:relative;width:62px;height:280px;border-radius:31px;background:rgba(20,22,28,.9);border:1px solid #ffffff38;overflow:hidden;display:flex;align-items:end}.fill-wide{width:100%;background:white;border-radius:31px}.center-num{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:bold}.speaker-bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);width:26px;height:26px}
.arch-capsule{position:absolute;top:48px;left:50%;transform:translate(-50%,-60px);height:66px;padding:0 28px;border-radius:33px;background:rgba(20,22,28,.92);border:1px solid #ffffff33;box-shadow:0 20px 50px #000b;display:flex;align-items:center;min-width:520px;transition:transform .22s}.on .arch-capsule{transform:translate(-50%,0)}.cap-icon{width:28px;height:28px;margin-right:18px}.cap-dev{font-size:14px;margin-right:20px;white-space:nowrap}.cap-track{flex:1;height:14px;background:#ffffff38;border-radius:7px;overflow:hidden;margin-right:20px}.cap-fill{height:100%;background:white}.cap-num{font-size:24px;min-width:42px;text-align:right}
.arch-dial{position:absolute;right:64px;top:50%;transform:translateY(-50%) scale(.85);width:150px;height:150px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 20px 40px #000c);transition:transform .22s}.on .arch-dial{transform:translateY(-50%) scale(1)}.arch-dial svg{position:absolute;top:0;left:0;width:100%;height:100%;transform:rotate(-90deg)}.circle-bg{fill:#14161eE0;stroke:#ffffff26;stroke-width:6}.circle-val{fill:none;stroke:#f1f5f9;stroke-width:7;stroke-linecap:round;stroke-dasharray:408}.center-info{display:flex;flex-direction:column;align-items:center}.dial-val{font-size:34px;font-weight:bold}.dial-dev{font-size:12px}.mute .cap-num,.mute .dial-val{color:#ef4444}
</style></head><body>
<main id="setup"><div class="panel"><h1>Volume Bar Theme</h1><p>Choose the volume bar shown for external ARC/eARC audio. Volume is read from the TV's ARC report.</p><select id="theme"><option value="pill">Pill</option><option value="capsule">Capsule</option><option value="dial">Dial</option></select><div class="buttons"><button id="enable">Enable</button><button id="disable">Disable</button><button id="preview">Preview</button></div><p id="status">Rooted LG webOS TV required.</p></div></main><div id="vol-card"></div>
<script src="root-exec.js"></script><script>
(function(){var card=document.getElementById('vol-card'),setup=document.getElementById('setup'),timer=0,themeEl=document.getElementById('theme'),status=document.getElementById('status');
var themes={pill:function(s){return '<div class="arch-pill"><div class="dev-label">'+s.device+'</div><div class="pill-wide"><div class="center-num">'+s.volume+'</div><div class="fill-wide" style="height:'+s.pct+'%"></div><div class="speaker-bottom">'+s.icon+'</div></div></div>'},capsule:function(s){return '<div class="arch-capsule"><div class="cap-icon">'+s.icon+'</div><div class="cap-dev">'+s.device+'</div><div class="cap-track"><div class="cap-fill" style="width:'+s.pct+'%"></div></div><div class="cap-num">'+(s.mute?'MUTE':s.volume)+'</div></div>'},dial:function(s){var o=408-408*s.pct/100;return '<div class="arch-dial"><svg viewBox="0 0 150 150"><circle class="circle-bg" cx="75" cy="75" r="65"></circle><circle class="circle-val" cx="75" cy="75" r="65" style="stroke-dashoffset:'+o+'"></circle></svg><div class="center-info"><div class="dial-val">'+(s.mute?'MUTE':s.volume)+'</div><div class="dial-dev">'+s.device+'</div></div></div>'}};
function icon(){return '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M4 9h3l4-3.33A1 1 0 0 1 13 6.5v11a1 1 0 0 1-2 .8L7 15H4zM15 9a4 4 0 0 1 0 6v-6z"/></svg>'}
function show(p){var n=Math.max(0,Math.min(100,Number(p.volume)||0)),t=p.theme||'pill';document.body.className='overlay';setup.style.display='none';card.innerHTML=themes[t]({volume:n,pct:n,mute:!!p.mute,device:'HDMI eARC',icon:icon()});card.className='on';clearTimeout(timer);timer=setTimeout(function(){card.className='';window.close()},2200)}
function run(cmd,cb){if(!window.earcRootExec){cb(new Error('Homebrew root service unavailable'));return}window.earcRootExec(cmd,cb)}
function settings(){document.body.className='setup';setup.style.display='block';card.className='';window.PalmSystem&&PalmSystem.setWindowProperty&&PalmSystem.setWindowProperty('_WEBOS_WINDOW_TYPE','_WEBOS_WINDOW_TYPE_CARD');setTimeout(function(){document.getElementById('enable').focus()},50)}
document.getElementById('enable').onclick=function(){status.textContent='Enabling…';run('node /media/developer/apps/usr/palm/applications/com.fingers986.volumebartheme/runtime/control.js enable '+themeEl.value,function(e){status.textContent=e?e.message:'Enabled for external ARC/eARC audio.'})};
document.getElementById('disable').onclick=function(){status.textContent='Disabling…';run('node /media/developer/apps/usr/palm/applications/com.fingers986.volumebartheme/runtime/control.js disable',function(e){status.textContent=e?e.message:'Disabled; LG volume bar restored.'})};
document.getElementById('preview').onclick=function(){show({volume:42,mute:false,theme:themeEl.value})};
function params(){try{return PalmSystem.launchParams||{}}catch(e){return {}}}window.webOSRelaunch=function(){var p=params();if(typeof p.volume==='number')show(p);else settings();return true};document.addEventListener('webOSRelaunch',function(e){if(e.detail&&typeof e.detail.volume==='number')show(e.detail);else settings()});var p=params();if(typeof p.volume==='number')show(p);else settings();
}());</script></body></html>
