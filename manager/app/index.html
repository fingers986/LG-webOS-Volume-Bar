. Needs your OpenRouter key; the text goes to OpenRouter and the model provider, never audio.":"تشغيل: يُرسل ما تقوله أيضًا نصًا إلى نموذج لغوي عبر OpenRouter ويُعرض الرد على الشاشة. يحتاج مفتاح OpenRouter الخاص بك؛ يذهب النص إلى OpenRouter ومزوّد النموذج، والصوت أبدًا.","one is saved, leave empty to keep it":"المفتاح محفوظ، اتركه فارغًا لإبقائه","Open":"فتح","OpenRouter key":"مفتاح OpenRouter","optional":"اختياري","Optional. Records the Home button’s code. The Home key keeps working exactly as before.":"اختياري. يتعلّم رمز زر Home. يعمل زر Home تمامًا كما كان.","Optional. Speak into the remote and the TV turns it into text on the TV itself (Moonshine, English). The text can be sent to a server you run. Audio never leaves the TV. Needs a download of about 80 MB.":"اختياري. تحدّث إلى جهاز التحكم فيحوّل التلفاز الكلام إلى نص بنفسه (Moonshine، بالإنجليزية). يمكن إرسال النص إلى خادمك. لا يغادر الصوت التلفاز أبدًا. يحتاج تنزيلًا بنحو 80 ميغابايت.","over the running app, ready in the background (instant)":"فوق التطبيق، جاهز في الخلفية (فوري)","over the running app, started when pressed":"فوق التطبيق، يبدأ عند الضغط","Photo %d of %d · preparing":"الصورة %d من %d · جارٍ التجهيز","Photo %d of %d · sending":"الصورة %d من %d · جارٍ الإرسال","Photos from the Immich albums you chose, downloaded to the TV every six hours (and with Sync now), so Home never waits for Immich. At most 300.":"صور من ألبومات Immich المختارة، تُنزَّل إلى التلفاز كل ست ساعات (وبزر مزامنة الآن) كي لا تنتظر الشاشة الرئيسية Immich أبدًا. 300 على الأكثر.","Photos uploaded from a phone, kept on the TV. At most 100.":"صور رُفعت من هاتف وحُفظت على التلفاز. 100 على الأكثر.","Picture size":"حجم الصورة","Place":"المكان","Playlist":"قائمة التشغيل","Playlist address (M3U)":"عنوان قائمة التشغيل (M3U)","Playlist removed":"أُزيلت قائمة التشغيل","Playlist saved":"حُفظت قائمة التشغيل","Preparing the report…":"جارٍ تجهيز التقرير…","Preparing…":"جارٍ التجهيز…","Press and hold the text, then choose Copy":"اضغط مطوّلًا على النص ثم اختر نسخ","Press the %s button now…":"اضغط زر %s الآن…","Puts the dock, the top buttons, hidden apps, the app order and the clock back to the defaults. The theme stays.":"يعيد الشريط والأزرار العلوية والتطبيقات المخفية وترتيب التطبيقات والساعة إلى الافتراضي. تبقى السمة.","Reading status…":"جارٍ قراءة الحالة…","Reads the code of your remote’s Input button from the hook, then tests that our list opens. The default is 241. Clear goes back to it.":"يقرأ رمز زر Input في جهاز التحكم عبر الخطاف، ثم يختبر فتح قائمتنا. الافتراضي 241. إعادة الضبط تعيده إليه.","Recent":"الأخيرة","Recent channels cleared":"تم مسح القنوات الأخيرة","Records the code of the remote button that starts listening. Try the microphone button first; any spare button works.":"يتعلّم رمز زر جهاز التحكم الذي يبدأ الاستماع. جرّب زر الميكروفون أولًا؛ أي زر غير مستخدم يصلح.","Records the Guide button’s code. Afterwards it opens the Live TV channel guide over whatever is running (only while Live TV is on). Clear it to get LG’s guide back.":"يتعلّم رمز زر الدليل. بعدها يفتح دليل قنوات البث المباشر فوق كل شيء (فقط عندما يكون البث المباشر مفعّلًا). أعد ضبطه لاستعادة دليل LG.","Refresh playlist and guide":"تحديث قائمة التشغيل والدليل","Refreshing in the background":"يتم التحديث في الخلفية","Refreshing…":"جارٍ التحديث…","refused":"مرفوض","reloaded":"أُعيد تحميله","Remove all uploads":"إزالة كل الصور المرفوعة","Remove the playlist":"إزالة قائمة التشغيل","Remove the playlist?":"إزالة قائمة التشغيل؟","Remove voice":"إزالة الصوت","Removes the apps, the boot scripts and your settings, then restarts the TV so LG’s Home comes back.":"يزيل التطبيقات ونصوص الإقلاع وإعداداتك، ثم يعيد تشغيل التلفاز لتعود شاشة LG الرئيسية.","Reset Home customisation":"إعادة ضبط الشاشة الرئيسية","Restarting the service":"جارٍ إعادة تشغيل الخدمة","Restarts the TV; LG’s own Home is Home after it starts. You can switch back here.":"يعيد تشغيل التلفاز؛ بعد الإقلاع تكون شاشة LG الخاصة هي الشاشة الرئيسية. يمكنك العودة من هنا.","Restarts the TV; this launcher is Home after it starts.":"يعيد تشغيل التلفاز؛ بعد الإقلاع يكون هذا المشغّل هو الشاشة الرئيسية.","Right column":"العمود الأيمن","Running apps":"التطبيقات المفتوحة","Save":"حفظ","Save albums and sync":"حفظ الألبومات والمزامنة","Save JSON":"حفظ JSON","Saved":"تم الحفظ","Saved. Open Home on the TV to see it.":"تم الحفظ. افتح الشاشة الرئيسية على التلفاز لرؤيته.","Saved. The TV is loading your channels now; you can close this page.":"تم الحفظ. يحمّل التلفاز قنواتك؛ يمكنك إغلاق هذه الصفحة.","Saved. You can close this page.":"تم الحفظ. يمكنك إغلاق هذه الصفحة.","Saving…":"جارٍ الحفظ…","scan with a phone to copy the address and token":"امسحه بالهاتف لنسخ العنوان والرمز","Search":"بحث","Second line (where there is room)":"السطر الثاني (حيث توجد مساحة)","Select all":"تحديد الكل","selected":"محدد","Send the text to":"إرسال النص إلى","Send the text to your own server":"أرسل النص إلى خادمك","Sends what you say as text to Home Assistant’s Assist and shows its answer. Needs the address and a long-lived access token (Home Assistant profile page), entered on your phone. Choosing this row tests the connection.":"يرسل ما تقوله نصًا إلى Assist في Home Assistant ويعرض الرد. يحتاج العنوان ورمز وصول طويل الأمد (صفحة الملف الشخصي في Home Assistant)، يُدخلان من الهاتف. اختيار هذا السطر يختبر الاتصال.","Server token":"رمز الخادم","Service":"الخدمة","Service %s":"الخدمة %s","set up":"مُعدّ","Set up anyway":"الإعداد على أي حال","set up from your phone":"اضبطه من الهاتف","Set up from your phone":"الإعداد من الهاتف","set the Home Assistant address too":"أدخل عنوان Home Assistant أيضًا","set up Home Assistant first":"اضبط Home Assistant أولًا","Set up Live TV":"إعداد البث المباشر","Set up now":"الإعداد الآن","Set up with commands":"الإعداد بالأوامر","Setting up… %s":"جارٍ الإعداد… %s","Setting up… the screen blinks once while LG’s system restarts":"جارٍ الإعداد… تومض الشاشة مرة واحدة أثناء إعادة تشغيل نظام LG","Settings":"الإعدادات","Settings for Live TV: switch it on or off, set up or remove your playlist, refresh the guide and learn the Guide key.":"إعدادات البث المباشر: شغّله أو أوقفه، اضبط قائمة التشغيل أو أزلها، حدّث الدليل وعلّم زر الدليل.","Share log":"مشاركة السجل","Share the log":"مشاركة السجل","Show":"العرض","Show as QR code":"عرض رمز QR","Show Live TV":"إظهار البث المباشر","Shows a QR code. A phone that scans it opens a page, served by the TV for ten minutes, that shows the notification address and the token with Copy buttons (for Home Assistant, for example). The token is a secret.":"يعرض رمز QR. الهاتف الذي يمسحه يفتح صفحة (يقدّمها التلفاز عشر دقائق) فيها عنوان الإشعارات والرمز مع أزرار نسخ، مثلًا لـ Home Assistant. الرمز سرّي.","Shows a QR code. On the phone page you upload photos (they are made the right size on the phone), delete uploads, connect Immich, choose albums and hide single photos.":"يعرض رمز QR. في صفحة الهاتف ترفع الصور (يغيّر الهاتف حجمها)، وتحذف المرفوعة، وتصل Immich، وتختار الألبومات، وتخفي صورًا بعينها.","Shows a QR code. Scan it with a phone on the same Wi-Fi to copy a report for a bug report. Addresses and URL paths are masked; the page closes after ten minutes.":"يعرض رمز QR. امسحه بهاتف على شبكة Wi-Fi نفسها لنسخ تقرير لبلاغ خطأ. العناوين ومسارات URL مخفية؛ تُغلق الصفحة بعد عشر دقائق.","Shows a QR code. Scan it with a phone on the same Wi-Fi to enter your OpenRouter key, choose a model, write instructions and set a server address. Nothing is typed on the TV.":"يعرض رمز QR. امسحه بهاتف على شبكة Wi-Fi نفسها لإدخال مفتاح OpenRouter واختيار نموذج وكتابة التعليمات وتحديد عنوان الخادم. لا حاجة للكتابة على التلفاز.","Shows the address, the token and an example request.":"يعرض العنوان والرمز وطلبًا نموذجيًا.","Shows the commands to set the key, model and instructions from a shell, and how to ask by text.":"يعرض أوامر ضبط المفتاح والنموذج والتعليمات من الطرفية، وكيفية السؤال بالنص.","Size":"الحجم","Skip":"تخطٍّ","Small":"صغير","Speak now…":"تحدّث…","speak when the card appears":"تحدّث عندما تظهر البطاقة","Stable releases":"الإصدارات المستقرة","Stable releases are what most people want: at most one a day, made from the dev builds. Dev builds come with every change and can be less finished; choose Dev here, then use the Launcher and Service rows to install it. Going back to Stable offers the latest release again.":"الإصدارات المستقرة لمعظم الناس: واحد في اليوم على الأكثر، من إصدارات التطوير. تأتي إصدارات التطوير مع كل تغيير وقد تكون أقل نضجًا؛ اخترها هنا ثم ثبّتها من سطري المشغّل والخدمة. العودة إلى المستقرة تعرض أحدث إصدار مجددًا.","Start":"ابدأ","Starting":"جارٍ البدء","Starts listening without the button: speak when the card appears.":"يبدأ الاستماع دون زر: تحدّث عندما تظهر البطاقة.","Stops contentminer and nudge (recommendations and pop-up tips) and keeps sportsalarm from starting.":"يوقف contentminer وnudge (الاقتراحات والتلميحات المنبثقة) ويمنع تشغيل sportsalarm.","Stops LG’s ad, recommendation and telemetry services and blocks a few ad servers. Nothing is uninstalled, and it only applies while this launcher is Home.":"يوقف خدمات الإعلانات والتوصيات والقياسات في LG ويحجب بعض خوادم الإعلانات. لا يُحذف شيء، ويسري فقط ما دام هذا المشغّل هو الشاشة الرئيسية.","Stops LG’s ad, tracking, telemetry and suggestion services, in four groups you can switch separately. Nothing is uninstalled, and it only applies while this launcher is Home.":"يوقف خدمات الإعلانات والتتبّع والقياسات والتلميحات في LG، وهي أربع مجموعات يمكن تشغيل كل منها على حدة. لا يُحذف شيء، ويسري فقط ما دام هذا المشغّل هو الشاشة الرئيسية.","Stops remotelogger and service-logger, which collect logs and send them to LG.":"يوقف remotelogger وservice-logger اللذين يجمعان السجلات ويرسلانها إلى LG.","Stream":"البث","streams":"بثوث","Suggestions and nudges":"الاقتراحات والتذكيرات","Swaps the previous launcher version back in. The newer one stays available as an update.":"يستعيد الإصدار السابق من المشغّل. يبقى الأحدث متاحًا كتحديث.","Switch all off":"إيقاف الكل","Switch all on":"تشغيل الكل","Switch notifications on first":"شغّل الإشعارات أولًا","Switch off LG’s voice assistant":"إيقاف مساعد LG الصوتي","Switches every group on.":"يشغّل كل المجموعات.","Switches the debloat off: the services start again and the hosts lines are removed.":"يوقف Debloat: تعود الخدمات للعمل وتُزال أسطر hosts.","Switching…":"جارٍ التبديل…","Sync now":"مزامنة الآن","synced %s":"تمت المزامنة %s","Synced photos":"الصور المتزامنة","Syncing with Immich…":"جارٍ المزامنة مع Immich…","syncing…":"جارٍ المزامنة…","Syncing…":"جارٍ المزامنة…","syncing… %d new":"جارٍ المزامنة… %d جديدة","Syncing… %d new":"جارٍ المزامنة… %d جديدة","Take over the Input key":"التقاط زر Input","Tap Copy, then paste it into your message. Addresses and URL paths are masked. This page closes ten minutes after it was opened on the TV.":"اضغط نسخ والصقه في بلاغ. العناوين ومسارات URL مخفية. تُغلق الصفحة بعد عشر دقائق من فتحها على التلفاز.","tap to hide or show one":"اضغط للإخفاء أو الإظهار","Telemetry logs":"سجلات القياس","Temperature":"درجة الحرارة","Test connection and save":"اختبار الاتصال والحفظ","Test the connection":"اختبار الاتصال","Test.\nPress the Input button once more. Our Inputs list should open over this screen.":"اختبار.\nاضغط زر Input مرة أخرى. يجب أن تفتح قائمة مداخلنا فوق الشاشة.","Testing":"اختبار","Text":"نص","the address must start with http:// or https://":"يجب أن يبدأ العنوان بـ http:// أو https://","the address, the channel list, the guide and your favourites are deleted":"سيُحذف العنوان وقائمة القنوات والدليل والمفضلة","The AI and Home Assistant remember the last turns for ten minutes. This clears them.":"يتذكر الذكاء الاصطناعي وHome Assistant آخر الأدوار عشر دقائق. هذا يمسحها.","The AI only":"الذكاء الاصطناعي فقط","The background service behind the launcher: Live TV, picture notifications, the Input key, these updates. A failed update restores the previous files.":"خدمة المشغّل في الخلفية: البث المباشر، الإشعارات المصوّرة، زر Input، هذه التحديثات. التحديث الفاشل يستعيد الملفات القديمة.","the chosen albums have no photos the TV can show":"لا تحتوي الألبومات المختارة على صور يستطيع التلفاز عرضها","The colour of the focus ring and highlights":"لون حلقة التركيز والتمييزات","The date":"التاريخ","The Guide key.\nChoose Start, then press the Guide button on your remote. It then opens the Live TV channel guide instead of LG’s guide. Clear it to get LG’s guide back.":"زر الدليل.\nاختر ابدأ ثم اضغط زر الدليل في جهاز التحكم. بعدها يفتح دليل البث المباشر بدل دليل LG. أعد ضبطه لاستعادة دليل LG.","The Home key (optional).\nChoose Start, then press the Home button on your remote.":"زر Home (اختياري).\nاختر ابدأ ثم اضغط زر Home في جهاز التحكم.","The home screen you see. Updates come from GitHub releases and are checked against a SHA-256 file before they are installed. If a new launcher does not start, the previous one is put back.":"الشاشة الرئيسية التي تراها. تأتي التحديثات من إصدارات GitHub ويُتحقق منها بملف SHA-256 قبل التثبيت. إذا لم يبدأ المشغّل الجديد يعود السابق.","The hook did not attach on this firmware, so keys cannot be learned. The Input key stays with LG’s picker.\nUse Share log to report this.":"لم يتصل الخطاف على هذا البرنامج الثابت، فلا يمكن تعلّم الأزرار. يبقى زر Input لمنتقي LG.\nيرجى الإبلاغ عبر مشاركة السجل.","The Input key.\nChoose Start, then press the Input button on your remote.":"زر Input.\nاختر ابدأ ثم اضغط زر Input في جهاز التحكم.","The Inputs list did not open.\nIf LG’s own picker showed, the Input key is not mapped: learn it again or switch the Input key off.":"لم تُفتح قائمة المداخل.\nإذا ظهر منتقي LG فزر Input غير معيَّن: علّمه مجددًا أو أوقف التقاط زر Input.","The Inputs list opened: the Input key works.":"فُتحت قائمة المداخل: زر Input يعمل.","the install did not finish":"لم يكتمل التثبيت","the key is forgotten and its photos are deleted from the TV":"نُسي المفتاح وحُذفت صوره من التلفاز","the launcher’s Inputs list":"قائمة مداخل المشغّل","The launcher’s own settings go back to the defaults. Apps, the theme and everything in this app stay.":"تعود إعدادات المشغّل الخاصة إلى ال /* the debloat's four groups (scripts/debloat-stop.sh); options.debloatOff lists the ones switched off */
var DEBLOAT = [
  { id: 'ads', label: 'Ads', what: 'ad services and ad servers' },
  { id: 'tracking', label: 'Viewing tracking (LivePlus)', what: 'acr2' },
  { id: 'logs', label: 'Telemetry logs', what: 'remotelogger, service-logger' },
  { id: 'suggestions', label: 'Suggestions and nudges', what: 'contentminer, nudge, sportsalarm' },
];
/* Experimental: compressed memory (zram, helper/zram.js). The service answers with what the TV has now. */
var zr = null,
  zrSize = 512;
function zramLoad(stay) {
  api('/api/zram').then(
    function (r) {
      zr = r;
      zrSize = r.size || r.setting || zrSize;
      if (stay === true) {
        build();
        draw();
      } else push('experimental');
    },
    function () {
      banner('The service did not answer', 'err');
    }
  );
}
function zramSet(size) {
  banner('Applying\u2026', 'work');
  api('/api/zram', { size: size }, 130000).then(
    function (r) {
      zr = r;
      zrSize = r.size || r.setting || zrSize;
      banner(r.error || '', r.error ? 'err' : '');
      build();
      draw();
    },
    function () {
      banner('The service did not answer', 'err');
    }
  );
}
function debloatOn(id) {
  var o = st.options || {};
  return o.debloat !== false && (o.debloatOff || []).indexOf(id) < 0;
}
/* switching the last group off switches the debloat off; one group on while it is off switches it on with only that group */
function debloatToggle(id) {
  var o = st.options || {},
    off = (o.debloatOff || []).slice();
  if (debloatOn(id)) {
    off.push(id);
    return opt(off.length >= DEBLOAT.length ? { debloat: false, debloatOff: [] } : { debloatOff: off });
  }
  if (o.debloat === false)
    return opt({
      debloat: true,
      debloatOff: DEBLOAT.map(function (g) {
        return g.id;
      }).filter(function (g) {
        return g !== id;
      }),
    });
  opt({
    debloatOff: off.filter(function (g) {
      return g !== id;
    }),
  });
}

function volumeSub(theme) {
  if (theme === 'system') return tr('System default (LG webOS)');
  if (theme === 'capsule') return tr('Capsule');
  if (theme === 'dial') return tr('Dial');
  if (theme === 'pill') return tr('Pill');
  return tr('System default (LG webOS)');
}

function drawQr(url) {
  var q = qrcode(0, 'M');
  q.addData(url);
  q.make();
  var n = q.getModuleCount(),
    cell = Math.max(4, Math.floor(640 / (n + 8))),
    cv = $('qr'),
    size = cell * (n + 8),
    g;
  cv.width = cv.height = size;
  g = cv.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#000';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + 4) * cell, (r + 4) * cell, cell, cell);
}
